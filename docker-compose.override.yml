version: '3.4'

services:
  contoso.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=contoso.db;Database=Contoso;Username=postgres;Password=Your_password123;
    ports:
      - "8080:8080"
    depends_on:
      contoso.db:
        condition: service_healthy

  contoso.db:
    environment:
      - POSTGRES_PASSWORD=Your_password123
      - POSTGRES_DB=Contoso
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
